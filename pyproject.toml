[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacepulse"
version = "0.1.0"
description = "Health history and alerts for Hugging Face Spaces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["huggingface_hub", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["spacepulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
